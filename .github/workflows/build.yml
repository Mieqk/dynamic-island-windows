name: Build

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']   # a release tag with or without the "v"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach the installer and zip to (e.g. 1.8.0). Leave empty for a plain build.'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only used to publish a release (tag push or a manual run with a tag)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}   # a manual release run builds exactly the tagged code

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests (logic without the window)
        run: dotnet test tests/DynamicIsland.Tests/DynamicIsland.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish (self-contained, win-x64)
        run: dotnet publish DynamicIsland.csproj -c Release -r win-x64 --self-contained true -o publish/DynamicIsland

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/DynamicIsland -DestinationPath DynamicIsland-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-win-x64
          path: DynamicIsland-win-x64.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          [xml]$proj = Get-Content DynamicIsland.csproj
          $ver = ($proj.Project.PropertyGroup | Where-Object Version | Select-Object -First 1).Version
          & $iscc /Q "/DAppVer=$ver" installer/DynamicIsland.iss

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-setup
          path: dist/*-setup.exe

      # a release tag publishes a GitHub release with the installer and the portable zip;
      # the description is the matching section of CHANGELOG.md
      - name: Release notes from CHANGELOG
        if: github.ref_type == 'tag' || inputs.tag != ''
        shell: pwsh
        run: |
          $ver = "${{ inputs.tag || github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($ver)) .*?(?=^## |\z)")
          if ($m.Success) { $m.Value | Set-Content release-notes.md -Encoding UTF8 } else { "Atoll $ver" | Set-Content release-notes.md -Encoding UTF8 }

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            DynamicIsland-win-x64.zip
            dist/*-setup.exe

  # the browser extension: unit tests and a run in real Chromium with the extension loaded
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: npm test

      - name: End-to-end (Chromium with the extension)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Package (the same zip for Chrome and Firefox)
        run: zip -r ../atoll-extension.zip . -x "test/*" "node_modules/*" "package.json" "package-lock.json" "README.md"

      - uses: actions/upload-artifact@v4
        with:
          name: atoll-extension
          path: atoll-extension.zip
